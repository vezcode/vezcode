<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="title desc">
<title id="title">VEZ focus areas</title>
<desc id="desc">Software, infrastructure, automation and applied AI.</desc>
<rect width="1280" height="250" rx="24" fill="#0a0c10"/>
<rect x=".75" y=".75" width="1278.5" height="248.5" rx="23.25" fill="none" stroke="#262b33" stroke-width="1.5"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">
<text x="44" y="52" fill="#8f96a3" font-size="14" font-weight="600" letter-spacing="3">FOCUS AREAS</text>
<g transform="translate(44 83)">
  <g><rect width="276" height="121" rx="18" fill="#101319" stroke="#252a32"/><text x="22" y="39" fill="#f6f7f9" font-size="17" font-weight="650">01  SOFTWARE</text><text x="22" y="72" fill="#9299a5" font-size="14">Products, platforms</text><text x="22" y="94" fill="#9299a5" font-size="14">and digital systems.</text></g>
  <g transform="translate(292)"><rect width="276" height="121" rx="18" fill="#101319" stroke="#252a32"/><text x="22" y="39" fill="#f6f7f9" font-size="17" font-weight="650">02  INFRASTRUCTURE</text><text x="22" y="72" fill="#9299a5" font-size="14">Secure, self-hosted</text><text x="22" y="94" fill="#9299a5" font-size="14">and scalable.</text></g>
  <g transform="translate(584)"><rect width="276" height="121" rx="18" fill="#101319" stroke="#252a32"/><text x="22" y="39" fill="#f6f7f9" font-size="17" font-weight="650">03  AUTOMATION</text><text x="22" y="72" fill="#9299a5" font-size="14">Workflows built for</text><text x="22" y="94" fill="#9299a5" font-size="14">speed and reliability.</text></g>
  <g transform="translate(876)"><rect width="276" height="121" rx="18" fill="#101319" stroke="#252a32"/><text x="22" y="39" fill="#f6f7f9" font-size="17" font-weight="650">04  APPLIED AI</text><text x="22" y="72" fill="#9299a5" font-size="14">Useful intelligence,</text><text x="22" y="94" fill="#9299a5" font-size="14">not empty hype.</text></g>
</g>
</g>
